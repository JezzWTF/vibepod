[project]
name = "vibepod-server"
version = "0.2.0"
description = "VibePod Studio GPU line-take backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0", "torchaudio==2.8.0", "qwen-tts==0.1.1",
  "transformers==4.57.3", "accelerate==1.12.0", "huggingface-hub==0.36.2",
  "fastapi==0.142.2", "uvicorn==0.54.0", "soundfile==0.14.0",
  "pydantic==2.13.5", "python-multipart==0.0.32", "requests>=2.32.2", "pillow==12.2.0"
]
[dependency-groups]
dev = ["ruff>=0.11.0", "httpx==0.28.1"]
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "spike/results", "__pycache__"]
[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "B905", "B008"]
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
